<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Swing2Go Golf UF</title>
  <link rel="icon" href="../img/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { padding: 40px 16px 80px; }
    .admin-wrap { max-width: 900px; margin: 0 auto; }
    .admin-header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .admin-header img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .admin-header h1 { font-family: var(--font-display); font-size: 1.5rem; margin: 0; }

    .login-card {
      max-width: 360px; margin: 80px auto 0; background: #fff;
      border: 1px solid var(--line); border-radius: 4px; padding: 32px;
    }
    .login-card h2 { font-family: var(--font-display); margin: 0 0 6px; }
    .login-card p { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 20px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line-strong);
      border-radius: 3px; font-size: 1rem; font-family: inherit; margin-bottom: 12px;
    }
    .login-card .btn { width: 100%; }
    .login-error { color: var(--flag-red); font-size: 0.88rem; margin: 10px 0 0; display: none; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .admin-tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .admin-tab { background: none; border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 18px; font-size: 0.88rem; color: var(--ink-soft); }
    .admin-tab.active { background: var(--fairway); border-color: var(--fairway); color: var(--chalk); }

    .order-card { background: #fff; border: 1px solid var(--line); padding: 18px 20px; margin-bottom: 14px; }
    .order-card-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .order-card-top strong { font-family: var(--font-display); font-size: 1.05rem; }
    .order-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .order-badge.pending { background: var(--sand); color: var(--ink); }
    .order-badge.paid { background: var(--fairway); color: var(--chalk); }
    .order-badge.fulfilled { background: #dfe9e2; color: var(--fairway); }
    .order-badge.cancelled { background: var(--flag-red); color: #fff; }
    .order-meta { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 8px; }
    .order-items-list { font-size: 0.85rem; margin: 0 0 12px; padding-left: 18px; }
    .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .order-actions button { padding: 7px 14px; font-size: 0.8rem; border-radius: 3px; border: 1px solid var(--line-strong); background: #fff; }
    .order-actions button.primary { background: var(--fairway); color: var(--chalk); border-color: var(--fairway); }

    table.product-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
    table.product-table th, table.product-table td {
      text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; vertical-align: middle;
    }
    table.product-table th { background: var(--sand); font-weight: 600; }
    table.product-table input, table.product-table select, table.product-table textarea {
      width: 100%; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 3px;
      font-family: inherit; font-size: 0.88rem;
    }
    table.product-table textarea { min-height: 44px; resize: vertical; }
    .row-actions { display: flex; gap: 8px; white-space: nowrap; }
    .row-actions button { padding: 6px 12px; font-size: 0.8rem; border-radius: 3px; border: 1px solid var(--line-strong); background: #fff; }
    .row-actions .save-btn { background: var(--fairway); color: var(--chalk); border-color: var(--fairway); }
    .row-actions .delete-btn { color: var(--flag-red); border-color: var(--flag-red); }

    .add-product-card {
      background: #fff; border: 1px solid var(--line); padding: 24px; margin-top: 28px;
    }
    .add-product-card h3 { font-family: var(--font-display); margin: 0 0 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 4px; }
    .form-grid input, .form-grid select, .form-grid textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 3px; font-family: inherit; font-size: 0.9rem;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .status-msg { font-size: 0.88rem; margin-top: 12px; display: none; }
    .status-msg.success { color: var(--fairway); }
    .status-msg.error { color: var(--flag-red); }

    .thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 3px; background: var(--sand); display: block; }
    .thumb-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .thumb-upload-btn { font-size: 0.72rem; padding: 3px 8px !important; }
    .image-drop {
      border: 1px dashed var(--line-strong); border-radius: 4px; padding: 16px;
      text-align: center; cursor: pointer; background: var(--chalk);
    }
    .image-drop img { max-width: 120px; max-height: 120px; border-radius: 4px; display: block; margin: 0 auto 8px; }
    .image-drop p { margin: 0; font-size: 0.82rem; color: var(--ink-soft); }
      .form-grid { grid-template-columns: 1fr; }
      table.product-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>

  <!-- Inloggning -->
  <div class="login-card" id="login-view">
    <h2>Admin</h2>
    <p>Logga in för att hantera Swing2Go Golf UF:s sortiment.</p>
    <input type="password" id="password-input" placeholder="Lösenord" autocomplete="current-password" />
    <button class="btn btn-primary" id="login-button">Logga in</button>
    <div class="login-error" id="login-error">Fel lösenord. Försök igen.</div>
  </div>

  <!-- Adminvy -->
  <div class="admin-wrap" id="admin-view" hidden>
    <div class="admin-header">
      <img src="../img/logo.jpg" alt="Swing2Go Golf UF" />
      <h1>Admin</h1>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="products-panel">Produkter</button>
      <button class="admin-tab" data-tab="orders-panel">Ordrar</button>
      <button class="btn btn-outline" id="logout-button" style="margin-left:auto;">Logga ut</button>
    </div>

    <div id="products-panel">
    <div class="toolbar">
      <span id="product-count" style="color: var(--ink-soft); font-size: 0.9rem;"></span>
    </div>

    <div style="overflow-x:auto;">
      <table class="product-table" id="product-table">
        <thead>
          <tr>
            <th style="width:64px;">Bild</th>
            <th style="min-width:160px;">Namn</th>
            <th style="min-width:180px;">Beskrivning</th>
            <th>Kategori</th>
            <th style="width:90px;">Pris (kr)</th>
            <th style="width:70px;">Lager</th>
            <th style="width:140px;"></th>
          </tr>
        </thead>
        <tbody id="product-table-body"></tbody>
      </table>
    </div>

    <div class="add-product-card">
      <h3>Lägg till ny produkt</h3>
      <div class="form-grid">
        <div class="full">
          <label>Bild</label>
          <div class="image-drop" id="new-image-drop">
            <img id="new-image-preview" src="" alt="" hidden />
            <p id="new-image-drop-text">Klicka för att välja en bild (JPEG, PNG eller WEBP, max 5 MB)</p>
          </div>
          <input type="file" id="new-image-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
          <input type="hidden" id="new-image-url" value="" />
        </div>
        <div>
          <label>Namn</label>
          <input type="text" id="new-name" placeholder="T.ex. Tour Line golfbollar (dussin)" />
        </div>
        <div>
          <label>Kategori</label>
          <select id="new-category">
            <option value="balls">Bollar</option>
            <option value="gear">Utrustning</option>
            <option value="apparel">Kläder</option>
          </select>
        </div>
        <div class="full">
          <label>Beskrivning</label>
          <textarea id="new-description" placeholder="Kort beskrivning som visas på produktkortet"></textarea>
        </div>
        <div>
          <label>Pris (kr)</label>
          <input type="number" id="new-price" min="0" step="1" placeholder="299" />
        </div>
        <div>
          <label>Lagersaldo</label>
          <input type="number" id="new-stock" min="0" step="1" placeholder="50" />
        </div>
        <div>
          <label>Ikon</label>
          <select id="new-icon">
            <option value="ball">Golfboll</option>
            <option value="glove">Handske</option>
            <option value="tee">Tee</option>
            <option value="towel">Handduk</option>
            <option value="tool">Lagningsverktyg</option>
            <option value="shirt">Tröja</option>
          </select>
        </div>
        <div>
          <label>Accentfärg</label>
          <input type="color" id="new-accent" value="#1B4332" style="height: 42px; padding: 4px;" />
        </div>
      </div>
      <button class="btn btn-primary" id="add-product-button" style="margin-top: 16px;">Lägg till produkt</button>
      <div class="status-msg" id="add-status"></div>
    </div>
    </div>

    <div id="orders-panel" hidden>
      <div class="toolbar">
        <span id="order-count" style="color: var(--ink-soft); font-size: 0.9rem;"></span>
      </div>
      <div id="orders-list"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'swing2gouf_admin_token';
    const CATEGORY_LABELS = { balls: 'Bollar', gear: 'Utrustning', apparel: 'Kläder' };

    const loginView = document.getElementById('login-view');
    const adminView = document.getElementById('admin-view');

    function getToken() {
      return sessionStorage.getItem(TOKEN_KEY);
    }

    function setToken(token) {
      sessionStorage.setItem(TOKEN_KEY, token);
    }

    function clearToken() {
      sessionStorage.removeItem(TOKEN_KEY);
    }

    function showLogin() {
      loginView.hidden = false;
      adminView.hidden = true;
    }

    function showAdmin() {
      loginView.hidden = true;
      adminView.hidden = false;
      loadProducts();
    }

    // ---------- Flikar ----------
    document.querySelectorAll('.admin-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('products-panel').hidden = tab.dataset.tab !== 'products-panel';
        document.getElementById('orders-panel').hidden = tab.dataset.tab !== 'orders-panel';
        if (tab.dataset.tab === 'orders-panel') loadOrders();
      });
    });

    // ---------- Ordrar ----------
    const ORDER_STATUS_LABELS = { pending: 'Väntar', paid: 'Betald', fulfilled: 'Skickad', cancelled: 'Avbruten' };
    const PAYMENT_METHOD_LABELS = { swish: 'Swish', stripe: 'Kort' };

    async function loadOrders() {
      const listEl = document.getElementById('orders-list');
      listEl.innerHTML = '<p>Laddar…</p>';
      try {
        const res = await apiFetch('/api/admin/orders');
        const orders = await res.json();
        document.getElementById('order-count').textContent = `${orders.length} ordrar`;
        renderOrders(orders);
      } catch (err) {
        listEl.innerHTML = `<p>${err.message}</p>`;
      }
    }

    function renderOrders(orders) {
      const listEl = document.getElementById('orders-list');
      if (orders.length === 0) {
        listEl.innerHTML = '<p style="color: var(--ink-soft);">Inga ordrar än.</p>';
        return;
      }

      listEl.innerHTML = orders
        .map((order) => {
          const itemsHtml = (order.items || [])
            .map((i) => `<li>${i.quantity} × ${escapeHtml(i.product_name)}</li>`)
            .join('');
          const date = new Date(order.created_at).toLocaleString('sv-SE');
          const amount = (order.amount_total_cents / 100).toLocaleString('sv-SE', { style: 'currency', currency: 'SEK' });
          const paidNote = order.payment_method === 'swish' && order.customer_marked_paid && order.status === 'pending'
            ? '<div style="color: var(--fairway); font-size: 0.82rem; margin-bottom: 8px;">Kunden har klickat "Jag har betalat" — kolla Swish-appen.</div>'
            : '';

          return `
          <div class="order-card" data-id="${order.id}">
            <div class="order-card-top">
              <strong>${escapeHtml(order.order_number || order.stripe_session_id || order.id.slice(0, 8))}</strong>
              <span class="order-badge ${order.status}">${ORDER_STATUS_LABELS[order.status] || order.status}</span>
            </div>
            <div class="order-meta">
              ${date} · ${PAYMENT_METHOD_LABELS[order.payment_method] || order.payment_method} · ${amount}<br/>
              ${escapeHtml(order.customer_name || '')} ${order.customer_email ? '· ' + escapeHtml(order.customer_email) : ''}<br/>
              ${order.shipping_address ? escapeHtml(order.shipping_address) : ''}
            </div>
            ${paidNote}
            <ul class="order-items-list">${itemsHtml}</ul>
            <div class="order-actions">
              ${order.status === 'pending' ? `<button class="primary" data-action="paid">Markera som betald</button>` : ''}
              ${order.status === 'paid' ? `<button class="primary" data-action="fulfilled">Markera som skickad</button>` : ''}
              ${order.status !== 'cancelled' && order.status !== 'fulfilled' ? `<button data-action="cancelled">Avbryt order</button>` : ''}
            </div>
          </div>`;
        })
        .join('');

      listEl.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', () => updateOrderStatus(
          btn.closest('.order-card').dataset.id,
          btn.dataset.action
        ));
      });
    }

    async function updateOrderStatus(id, status) {
      try {
        const res = await apiFetch('/api/admin/orders', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status }),
        });
        if (!res.ok) throw new Error('Kunde inte uppdatera ordern.');
        loadOrders();
      } catch (err) {
        alert(err.message);
      }
    }

    // ---------- Inloggning ----------
    document.getElementById('login-button').addEventListener('click', login);
    document.getElementById('password-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const password = document.getElementById('password-input').value;
      const errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Inloggning misslyckades.');
        setToken(data.token);
        showAdmin();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }

    document.getElementById('logout-button').addEventListener('click', () => {
      clearToken();
      showLogin();
    });

    // ---------- Produktlista ----------
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          Authorization: `Bearer ${getToken()}`,
        },
      });
      if (res.status === 401) {
        clearToken();
        showLogin();
        throw new Error('Sessionen har gått ut.');
      }
      return res;
    }

    async function loadProducts() {
      const tbody = document.getElementById('product-table-body');
      tbody.innerHTML = `<tr><td colspan="6">Laddar…</td></tr>`;
      try {
        const res = await apiFetch('/api/admin/products');
        const products = await res.json();
        document.getElementById('product-count').textContent = `${products.length} produkter`;
        renderTable(products);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6">${err.message}</td></tr>`;
      }
    }

    function renderTable(products) {
      const tbody = document.getElementById('product-table-body');
      tbody.innerHTML = products
        .map(
          (p) => `
        <tr data-id="${p.id}">
          <td>
            <div class="thumb-cell">
              <img class="thumb row-thumb" src="${p.image_url ? escapeAttr(p.image_url) : ''}" style="${p.image_url ? '' : 'display:none;'}" alt="" />
              <button class="thumb-upload-btn" data-action="change-image" type="button">${p.image_url ? 'Byt' : 'Lägg till'}</button>
              <input type="file" class="row-image-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
            </div>
          </td>
          <td><input type="text" class="f-name" value="${escapeAttr(p.name)}" /></td>
          <td><textarea class="f-description">${escapeHtml(p.description || '')}</textarea></td>
          <td>
            <select class="f-category">
              ${Object.entries(CATEGORY_LABELS)
                .map(([val, label]) => `<option value="${val}" ${p.category === val ? 'selected' : ''}>${label}</option>`)
                .join('')}
            </select>
          </td>
          <td><input type="number" class="f-price" min="0" step="1" value="${(p.price_cents / 100).toFixed(0)}" /></td>
          <td><input type="number" class="f-stock" min="0" step="1" value="${p.stock}" /></td>
          <td>
            <div class="row-actions">
              <button class="save-btn" data-action="save">Spara</button>
              <button class="delete-btn" data-action="delete">Ta bort</button>
            </div>
          </td>
        </tr>`
        )
        .join('');

      tbody.querySelectorAll('[data-action="save"]').forEach((btn) =>
        btn.addEventListener('click', () => saveRow(btn.closest('tr')))
      );
      tbody.querySelectorAll('[data-action="delete"]').forEach((btn) =>
        btn.addEventListener('click', () => deleteRow(btn.closest('tr')))
      );
      tbody.querySelectorAll('[data-action="change-image"]').forEach((btn) =>
        btn.addEventListener('click', () => btn.closest('tr').querySelector('.row-image-file').click())
      );
      tbody.querySelectorAll('.row-image-file').forEach((input) =>
        input.addEventListener('change', () => handleRowImageChange(input))
      );
    }

    async function handleRowImageChange(input) {
      const file = input.files[0];
      if (!file) return;
      const row = input.closest('tr');
      const id = row.dataset.id;
      const btn = row.querySelector('[data-action="change-image"]');
      const originalText = btn.textContent;
      btn.textContent = 'Laddar upp…';
      btn.disabled = true;

      try {
        const url = await uploadImage(file);
        const res = await apiFetch('/api/admin/products', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, image_url: url }),
        });
        if (!res.ok) throw new Error('Kunde inte spara bilden.');
        loadProducts();
      } catch (err) {
        alert(err.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    // Laddar upp en bildfil via /api/admin/upload-image och returnerar publik URL.
    async function uploadImage(file) {
      const dataBase64 = await fileToBase64(file);
      const res = await apiFetch('/api/admin/upload-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataBase64, contentType: file.type }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Kunde inte ladda upp bilden.');
      return data.url;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function saveRow(row) {
      const id = row.dataset.id;
      const payload = {
        id,
        name: row.querySelector('.f-name').value,
        description: row.querySelector('.f-description').value,
        category: row.querySelector('.f-category').value,
        price_cents: Math.round(parseFloat(row.querySelector('.f-price').value || '0') * 100),
        stock: parseInt(row.querySelector('.f-stock').value || '0', 10),
      };
      try {
        const res = await apiFetch('/api/admin/products', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error('Kunde inte spara.');
        loadProducts();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteRow(row) {
      const name = row.querySelector('.f-name').value;
      if (!confirm(`Ta bort "${name}"? Detta går inte att ångra.`)) return;
      const id = row.dataset.id;
      try {
        const res = await apiFetch(`/api/admin/products?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Kunde inte ta bort produkten.');
        loadProducts();
      } catch (err) {
        alert(err.message);
      }
    }

    // ---------- Bilduppladdning i "Lägg till produkt" ----------
    document.getElementById('new-image-drop').addEventListener('click', () => {
      document.getElementById('new-image-file').click();
    });

    document.getElementById('new-image-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dropText = document.getElementById('new-image-drop-text');
      const preview = document.getElementById('new-image-preview');
      dropText.textContent = 'Laddar upp…';

      try {
        const url = await uploadImage(file);
        document.getElementById('new-image-url').value = url;
        preview.src = url;
        preview.hidden = false;
        dropText.textContent = 'Klicka för att välja en annan bild';
      } catch (err) {
        dropText.textContent = 'Uppladdningen misslyckades — försök igen.';
        console.error(err);
      }
    });

    // ---------- Lägg till produkt ----------
    document.getElementById('add-product-button').addEventListener('click', async () => {
      const statusEl = document.getElementById('add-status');
      statusEl.style.display = 'none';

      const payload = {
        name: document.getElementById('new-name').value.trim(),
        description: document.getElementById('new-description').value.trim(),
        category: document.getElementById('new-category').value,
        price_cents: Math.round(parseFloat(document.getElementById('new-price').value || '0') * 100),
        stock: parseInt(document.getElementById('new-stock').value || '0', 10),
        icon: document.getElementById('new-icon').value,
        accent: document.getElementById('new-accent').value,
        image_url: document.getElementById('new-image-url').value || null,
      };

      if (!payload.name || !payload.price_cents) {
        statusEl.textContent = 'Namn och pris krävs.';
        statusEl.className = 'status-msg error';
        statusEl.style.display = 'block';
        return;
      }

      try {
        const res = await apiFetch('/api/admin/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error('Kunde inte lägga till produkten.');

        statusEl.textContent = 'Produkten är tillagd.';
        statusEl.className = 'status-msg success';
        statusEl.style.display = 'block';

        ['new-name', 'new-description', 'new-price', 'new-stock', 'new-image-url'].forEach(
          (id) => (document.getElementById(id).value = '')
        );
        document.getElementById('new-image-preview').hidden = true;
        document.getElementById('new-image-drop-text').textContent = 'Klicka för att välja en bild (JPEG, PNG eller WEBP, max 5 MB)';
        loadProducts();
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'status-msg error';
        statusEl.style.display = 'block';
      }
    });

    // ---------- Hjälpfunktioner ----------
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/"/g, '&quot;');
    }

    // ---------- Start ----------
    if (getToken()) {
      showAdmin();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
