<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order bekräftad — Swing2GoUF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,900&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="img/logo.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="/" class="brand" aria-label="Swing2Go Golf UF, till startsidan">
        <img src="img/logo.jpg" alt="Swing2Go Golf UF" class="brand-logo" />
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="wrap" style="grid-template-columns: 1fr;">
      <div>
        <h1>Du är i klubbhuset.</h1>
        <p>Din beställning gick igenom. Ett kvitto är på väg till din e-post, och vi skickar din order inom kort.</p>
        <a href="/" class="btn btn-primary">Tillbaka till butiken</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year"></span> Swing2Go Golf UF. Spela bollen som den ligger.</p>
    </div>
  </footer>
  <script src="js/app.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
