<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swing2Go – Begagnade golfbollar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2314532d'/%3E%3Ccircle cx='28' cy='40' r='10' fill='%23fff'/%3E%3Cpath d='M38 10v32' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M38 10l14 6-14 6z' fill='%23d4a72c'/%3E%3C/svg%3E">
<style>
:root{--primary:#14532d;--accent:#22c55e;--bg:#f6faf4;--ink:#10231a;--gold:#d4a72c;
--card:color-mix(in srgb,var(--bg),var(--ink) 5%);--line:color-mix(in srgb,var(--ink),transparent 85%);--muted:color-mix(in srgb,var(--ink),transparent 38%)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.logo{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
h2{font-size:1.9rem;margin-bottom:6px}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:40;background:var(--primary);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:700;text-decoration:none}
nav{display:flex;gap:22px;align-items:center}
nav a{text-decoration:none;opacity:.9}nav a:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#1a1a12}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn.danger{background:#b3261e}
.hero{position:relative;min-height:540px;color:#fff;background:#0f3d24 center/cover no-repeat;overflow:hidden;display:flex;align-items:flex-start}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,34,20,.82),rgba(6,34,20,.45) 55%,rgba(6,34,20,.05))}
.hero .wrap{position:relative;z-index:2;padding-top:84px}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);max-width:12ch;letter-spacing:-.01em}
.hero p{max-width:46ch;font-size:1.15rem;margin:18px 0 28px;opacity:.95}
.usp{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:-1px;background:var(--primary);color:#fff}
.usp div{padding:18px 20px;border-left:1px solid rgba(255,255,255,.18)}
.usp div:first-child{border-left:0}
.section{padding:56px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pimg{aspect-ratio:4/3;background:color-mix(in srgb,var(--accent),var(--bg) 82%);display:flex;align-items:center;justify-content:center}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg svg{width:44%}
.pbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{font-size:1.2rem}
.pbody p{margin:0;font-size:.95rem;flex:1}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-size:1.25rem}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold),transparent 75%)}
.tag.red{background:#b3261e22;color:#b3261e}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:22px}
.steps div{border-top:3px solid var(--accent);padding-top:12px}
footer{background:var(--primary);color:#fff;padding:30px 0;margin-top:30px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--bg);border-radius:20px;max-width:540px;width:100%;max-height:92vh;overflow:auto;padding:24px}
.box h2{margin-bottom:14px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer;font-size:1rem}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit}
label.f{display:block;margin-bottom:12px;font-size:.92rem}
.two{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.err{color:#b3261e;margin:8px 0;min-height:1.4em}
.swish{text-align:center}
.swish img{width:210px;height:210px;background:#fff;border-radius:12px;padding:8px}
.bigmsg{font-size:1.3rem;font-weight:700}
#fall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fall span{position:absolute;top:-40px;animation:fall linear infinite}
#fall .ball{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#dfe6e0 60%,#b9c4bc)}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:44px;width:auto;display:block;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.28)}
.herorow{display:flex;align-items:flex-start;justify-content:space-between;gap:32px}
.herologo{flex:0 0 auto;width:min(290px,30vw);height:auto;border-radius:28px;border:4px solid rgba(255,255,255,.88);box-shadow:0 18px 50px rgba(0,0,0,.35);margin-top:-8px}
footer .wrap{align-items:center}
.mlogo{display:block;width:92px;height:92px;border-radius:20px;margin:0 auto 14px;box-shadow:0 0 0 1px var(--line)}
/* Admin */
.admin{max-width:1000px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.tabs button{border:1px solid var(--line);background:var(--card);color:inherit;padding:9px 18px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font:700 2.2rem Georgia,serif}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin:10px 0 24px}
.bars div{flex:1;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;position:relative}
.bars small{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted);padding-top:3px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.cols ul{list-style:none;padding:0;margin:6px 0 0}
.cols li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.arow{display:grid;grid-template-columns:90px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.aimg{width:90px;height:90px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--accent),var(--bg) 80%)}
.aimg img{width:100%;height:100%;object-fit:cover}
.agrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.agrid textarea{grid-column:1/-1;min-height:54px}
.acts{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ord{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.colors input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
@media(max-width:720px){.herologo{display:none}.brand img{height:38px}nav a.hide{display:none}.usp,.steps{grid-template-columns:1fr}.usp div{border-left:0;border-top:1px solid rgba(255,255,255,.18)}.two,.agrid{grid-template-columns:1fr}.hero{min-height:480px}}
@media(prefers-reduced-motion:reduce){#fall{display:none}}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr = n => new Intl.NumberFormat('sv-SE').format(n) + ' kr';
const IS_ADMIN = location.pathname.startsWith('/admin');
const SWISH = '0709355007';
let SITE = {};

async function call(path, opt = {}) {
  const r = await fetch(path, opt);
  let d = null; try { d = await r.json(); } catch {}
  if (!d) throw Object.assign(new Error(`Servern svarade inte som väntat (status ${r.status}). Workern körs troligen inte, kontrollera deploy-inställningarna i Cloudflare.`), { status: r.status });
  if (!r.ok) throw Object.assign(new Error(d.error || 'Något gick fel'), { status: r.status });
  return d;
}

/* ---------- Tema & säsong ---------- */
const SEASONS = {golf:['ball'],halloween:['👻','🎃','🦇'],autumn:['🍂','🍁'],winter:['❄️','❅'],jul:['🎄','⭐','❄️'],pask:['🐣','🌷'],midsommar:['🌼','🌿']};
const SEASON_NAMES = {none:'Ingen',golf:'Golfbollar',halloween:'Halloween (spöken)',autumn:'Höstlov (löv)',winter:'Vinter',jul:'Jul',pask:'Påsk',midsommar:'Midsommar'};
function season(n) {
  const el = $('#fall'); el.innerHTML = '';
  const set = SEASONS[n]; if (!set) return;
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span'), t = set[i % set.length];
    if (t === 'ball') { s.className = 'ball'; s.style.width = s.style.height = (12 + Math.random() * 12) + 'px'; }
    else { s.textContent = t; s.style.fontSize = (16 + Math.random() * 18) + 'px'; }
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (8 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 18) + 's';
    el.append(s);
  }
}
function applyTheme(s) {
  const r = document.documentElement.style, c = s.colors || {};
  for (const k of ['primary','accent','bg','ink','gold']) if (c[k]) r.setProperty('--' + k, c[k]);
  season(s.season);
}

/* ---------- Butik ---------- */
let PRODUCTS = [], CART = {};
try { CART = JSON.parse(localStorage.getItem('s2g_cart') || '{}'); } catch { CART = {}; }
const saveCart = () => { try { localStorage.setItem('s2g_cart', JSON.stringify(CART)); } catch {} };
const cartLines = () => Object.entries(CART).map(([id, qty]) => ({ p: PRODUCTS.find(x => x.id === id), qty })).filter(l => l.p);
const cartCount = () => cartLines().reduce((a, l) => a + l.qty, 0);
const subtotal = () => cartLines().reduce((a, l) => a + l.p.price_sek * l.qty, 0);
const shipping = () => Number(SITE.shipping_sek ?? 59);

function card(p) {
  const out = p.stock < 1;
  return `<article class="card"><div class="pimg">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : BALL}</div>
  <div class="pbody"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description)}</p>
  <div class="prow"><b class="price">${kr(p.price_sek)}</b>${out ? '<span class="tag red">Slut</span>' : p.stock <= 3 ? `<span class="tag">Endast ${p.stock} kvar</span>` : ''}</div>
  <button class="btn" data-add="${esc(p.id)}" ${out ? 'disabled' : ''}>Lägg i varukorgen</button></div></article>`;
}

function renderShop() {
  const hero = SITE.hero_image ? `style="background-image:url('${esc(SITE.hero_image)}')"` : '';
  $('#app').innerHTML = `
  <header><div class="wrap"><a class="brand" href="/" aria-label="${esc(SITE.title || 'Swing2Go')}"><img src="${LOGO_HEAD}" alt="${esc(SITE.title || 'Swing2Go')} Golf UF"></a>
  <nav><a class="hide" href="#produkter">Produkter</a><a class="hide" href="#sa-funkar-det">Så funkar det</a>
  <button class="btn gold sm" data-cart>Varukorg (<span id="cc">${cartCount()}</span>)</button></nav></div></header>
  <section class="hero" ${hero}>${SITE.hero_image ? '' : COURSE}<div class="wrap herorow"><div><h1>${esc(SITE.hero_title || 'Slå längre. Betala mindre.')}</h1>
  <p>${esc(SITE.hero_text || '')}</p><a class="btn gold" href="#produkter">Se bollarna</a></div>
  <img class="herologo" src="${LOGO_MAIN}" alt="Swing2Go Golf UF"></div></section>
  <div class="usp"><div class="wrap" style="display:contents"><div><b>Betala med Swish</b><br>Snabbt och tryggt i mobilen</div><div><b>Köp som gäst</b><br>Inget konto, inga lösenord</div><div><b>Begagnat</b><br>Bra för plånboken och miljön</div></div></div>
  <section class="section" id="produkter"><div class="wrap"><h2>Våra bollar</h2><p class="muted">${esc(SITE.tagline || '')}</p>
  <div class="grid">${PRODUCTS.length ? PRODUCTS.map(card).join('') : '<p class="muted">Inga produkter just nu. Kom tillbaka snart!</p>'}</div></div></section>
  <section class="section" id="sa-funkar-det" style="padding-top:10px"><div class="wrap"><h2>Så funkar det</h2>
  <div class="steps"><div><h3>Välj bollar</h3><p class="muted">Lägg det du vill ha i varukorgen och gå till kassan.</p></div>
  <div><h3>Swisha</h3><p class="muted">Du får summan och ett meddelande färdigifyllt i Swish.</p></div>
  <div><h3>Vi skickar</h3><p class="muted">När vi sett din betalning packar och skickar vi ordern.</p></div></div></div></section>
  <footer><div class="wrap"><span style="display:flex;align-items:center;gap:14px"><a class="brand" href="/"><img src="${LOGO_HEAD}" alt="Swing2Go Golf UF"></a>© ${new Date().getFullYear()} ${esc(SITE.title || 'Swing2Go')} Golf UF</span><span>Betalning sker via Swish</span></div></footer>`;
}
const refreshCount = () => { const e = $('#cc'); if (e) e.textContent = cartCount(); };
const openModal = html => { $('#modal').innerHTML = `<div class="modal" data-close><div class="box" role="dialog" aria-modal="true">${html}</div></div>`; };
const closeModal = () => { $('#modal').innerHTML = ''; };

function addToCart(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  CART[id] = Math.min((CART[id] || 0) + 1, p.stock); saveCart(); refreshCount(); showCart();
}
function showCart() {
  const L = cartLines();
  if (!L.length) return openModal(`<h2>Varukorgen</h2><p class="muted">Den är tom. Lägg några bollar i den först.</p><button class="btn" data-x>Fortsätt handla</button>`);
  openModal(`<h2>Varukorgen</h2>${L.map(({ p, qty }) => `<div class="line"><div><b>${esc(p.name)}</b><br><span class="muted">${kr(p.price_sek)} / st</span></div>
  <div class="qty"><button data-dec="${esc(p.id)}" aria-label="Minska">−</button>${qty}<button data-inc="${esc(p.id)}" aria-label="Öka">+</button></div></div>`).join('')}
  <div class="line"><span>Delsumma</span><span>${kr(subtotal())}</span></div><div class="line"><span>Frakt</span><span>${kr(shipping())}</span></div>
  <div class="line"><b>Totalt</b><b>${kr(subtotal() + shipping())}</b></div><br>
  <button class="btn" style="width:100%" data-checkout>Till kassan</button>`);
}
function showCheckout() {
  openModal(`<h2>Kassa</h2><form id="co"><label class="f">Namn *<input class="in" name="name" autocomplete="name" required></label>
  <label class="f">E-post *<input class="in" type="email" name="email" autocomplete="email" required></label>
  <label class="f">Telefon<input class="in" type="tel" name="phone" autocomplete="tel"></label>
  <label class="f">Adress *<input class="in" name="address" autocomplete="street-address" required></label>
  <div class="two"><label class="f">Postnummer *<input class="in" name="zip" autocomplete="postal-code" required></label><label class="f">Ort *<input class="in" name="city" autocomplete="address-level2" required></label></div>
  <div class="line"><b>Att betala</b><b>${kr(subtotal() + shipping())}</b></div><div class="err" id="cerr" role="alert"></div>
  <button class="btn" style="width:100%" id="cbtn">Fortsätt till Swish</button></form>`);
}
async function submitOrder(form) {
  const btn = $('#cbtn'); btn.disabled = true; $('#cerr').textContent = '';
  const f = Object.fromEntries(new FormData(form));
  try {
    const d = await call('/api/order', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ customer: f, items: cartLines().map(l => ({ id: l.p.id, qty: l.qty })) }) });
    CART = {}; saveCart(); refreshCount(); showSwish(d);
  } catch (e) { $('#cerr').textContent = e.message; btn.disabled = false; }
}
function showSwish(d) {
  const link = 'swish://payment?data=' + encodeURIComponent(JSON.stringify({ version: 1,
    payee: { value: d.swish.number, editable: false }, amount: { value: d.total_sek, editable: false },
    message: { value: d.swish.message, editable: false } }));
  openModal(`<div class="swish"><img class="mlogo" src="${LOGO_MAIN}" alt="Swing2Go"><h2>Order #${d.order_no} är lagd</h2><p>Betala nu med Swish så skickar vi din order.</p>
  <p class="bigmsg">${kr(d.total_sek)}</p>
  <a class="btn gold" href="${esc(link)}">Öppna Swish</a>
  <p class="muted" style="margin:16px 0 6px">Sitter du vid en dator? Skanna koden med Swish-appen.</p>
  <img src="/api/qr?amount=${d.total_sek}&msg=${encodeURIComponent(d.swish.message)}" alt="Swish QR-kod" onerror="this.style.display='none'">
  <p>Eller swisha manuellt till <b>${esc(d.swish.number)}</b><br>Skriv <b>${esc(d.swish.message)}</b> som meddelande.</p>
  <button class="btn" data-x>Jag har betalat</button>
  <p class="muted" style="font-size:.85rem">Vi bekräftar din order när betalningen syns hos oss. Spara ordernumret #${d.order_no}.</p></div>`);
}

async function initShop() {
  const d = await call('/api/shop');
  SITE = d.site; PRODUCTS = d.products; applyTheme(SITE); document.title = (SITE.title || 'Swing2Go') + ' – Begagnade golfbollar';
  for (const id of Object.keys(CART)) if (!PRODUCTS.find(p => p.id === id)) delete CART[id];
  renderShop();
  fetch('/api/hit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path: '/', fresh: true, ref: document.referrer }) }).catch(() => {});
  setInterval(() => { if (!document.hidden) fetch('/api/hit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path: '/' }) }).catch(() => {}); }, 45000);
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('[data-close]') || t.closest('[data-x]')) return closeModal();
  let el;
  if ((el = t.closest('[data-add]'))) return addToCart(el.dataset.add);
  if (t.closest('[data-cart]')) return showCart();
  if ((el = t.closest('[data-inc]'))) { const p = PRODUCTS.find(x => x.id === el.dataset.inc); CART[p.id] = Math.min(CART[p.id] + 1, p.stock); saveCart(); refreshCount(); return showCart(); }
  if ((el = t.closest('[data-dec]'))) { const id = el.dataset.dec; if (--CART[id] < 1) delete CART[id]; saveCart(); refreshCount(); return showCart(); }
  if (t.closest('[data-checkout]')) return showCheckout();
});
document.addEventListener('submit', e => { if (e.target.id === 'co') { e.preventDefault(); submitOrder(e.target); } });

/* ---------- Admin ---------- */
let TOK = sessionStorage.getItem('s2g_tok') || '', TAB = 'stats', TIMER;
async function adm(path, method = 'GET', body) {
  try {
    return await call('/api/admin/' + path, { method, headers: { authorization: 'Bearer ' + TOK, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { if (e.status === 401 && TOK) { TOK = ''; sessionStorage.removeItem('s2g_tok'); adminLogin(); } throw e; }
}
async function upload(file) {
  const r = await fetch('/api/admin/upload', { method: 'POST', headers: { authorization: 'Bearer ' + TOK, 'content-type': file.type }, body: file });
  const d = await r.json(); if (!r.ok) throw new Error(d.error); return d.url;
}
function adminLogin() {
  clearInterval(TIMER);
  $('#app').innerHTML = `<div class="admin" style="max-width:380px;padding-top:70px"><img class="mlogo" src="${LOGO_MAIN}" alt="Swing2Go" style="margin:0 0 16px"><h2>Admin</h2><p class="muted">Logga in för att hantera butiken.</p>
  <form id="lg"><label class="f">Lösenord<input class="in" type="password" name="pw" autocomplete="current-password" required></label>
  <div class="err" id="lerr" role="alert"></div><button class="btn" style="width:100%">Logga in</button></form></div>`;
  $('#lg').onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    try { const d = await call('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: e.target.pw.value }) });
      TOK = d.token; sessionStorage.setItem('s2g_tok', TOK); adminShell();
    } catch (x) { $('#lerr').textContent = x.message; }
  };
}
const TABS = { stats: 'Översikt', orders: 'Ordrar', products: 'Produkter', theme: 'Utseende' };
function adminShell() {
  $('#app').innerHTML = `<div class="admin"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><a class="brand" href="/" aria-label="Till butiken"><img src="${LOGO_HEAD}" alt="Swing2Go" style="box-shadow:0 0 0 1px var(--line)"></a>
  <span><a class="btn ghost sm" href="/">Visa butiken</a> <button class="btn ghost sm" id="out">Logga ut</button></span></div>
  <div class="tabs">${Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === TAB ? 'on' : ''}">${v}</button>`).join('')}</div><div id="pane">Laddar…</div></div>`;
  $('#out').onclick = () => { TOK = ''; sessionStorage.removeItem('s2g_tok'); adminLogin(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; adminShell(); });
  clearInterval(TIMER);
  ({ stats: tabStats, orders: tabOrders, products: tabProducts, theme: tabTheme })[TAB]().catch(e => { const p = $('#pane'); if (p) p.innerHTML = `<p class="err">${esc(e.message)}</p>`; });
}
const list = a => a.length ? `<ul>${a.map(x => `<li><span>${esc(x.name)}</span><b>${x.n}</b></li>`).join('')}</ul>` : '<p class="muted">Ingen data ännu</p>';
async function tabStats() {
  const draw = async () => {
    const s = await adm('stats'); const pane = $('#pane'); if (!pane) return;
    const max = Math.max(1, ...s.days.map(d => d.views));
    pane.innerHTML = `<div class="stats"><div class="stat"><b>${s.online_now}</b>På sidan just nu</div><div class="stat"><b>${s.today_visitors}</b>Besökare idag</div><div class="stat"><b>${s.today_views}</b>Sidvisningar idag</div></div>
    <h3>Senaste 7 dagarna</h3><div class="bars" style="margin-bottom:34px">${s.days.map(d => `<div style="height:${Math.max(3, d.views / max * 100)}%" title="${d.views} visningar, ${d.visitors} besökare"><small>${esc(d.day.slice(5))}</small></div>`).join('') || '<p class="muted">Ingen data ännu</p>'}</div>
    <div class="cols"><div><h3>Sidor</h3>${list(s.top_pages)}</div><div><h3>Enhet</h3>${list(s.devices)}</div><div><h3>Land</h3>${list(s.countries)}</div><div><h3>Kommer från</h3>${list(s.referrers)}</div></div>
    <p class="muted" style="margin-top:22px;font-size:.88rem">Statistiken använder inga cookies. Besökare räknas med en anonym hash som byts varje dygn, och ingen IP-adress sparas. "På sidan just nu" är de som varit aktiva de senaste 5 minuterna.</p>`;
  };
  await draw(); TIMER = setInterval(() => draw().catch(() => {}), 20000);
}
const STATUS = { new: 'Ny, väntar på betalning', paid: 'Betald', shipped: 'Skickad', cancelled: 'Avbruten' };
async function tabOrders() {
  const o = await adm('orders');
  $('#pane').innerHTML = o.length ? o.map(x => `<div class="ord"><div class="prow"><b>#${x.order_no} · ${kr(x.total_sek)}</b>
  <select class="in" style="width:auto" data-ost="${x.id}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === x.status ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <p class="muted" style="margin:6px 0">${new Date(x.created_at).toLocaleString('sv-SE')}</p>
  <div>${x.items.map(i => `${i.qty} × ${esc(i.name)}`).join('<br>')}<br><span class="muted">Frakt ${kr(x.shipping_sek)}</span></div>
  <p style="margin:8px 0 0">${esc(x.name)} · ${esc(x.email)}${x.phone ? ' · ' + esc(x.phone) : ''}<br>${esc(x.address)}, ${esc(x.zip)} ${esc(x.city)}<br><span class="muted">Swish-meddelande: Swing2Go ${x.order_no}</span></p></div>`).join('')
    : '<p class="muted">Inga ordrar ännu.</p>';
  document.querySelectorAll('[data-ost]').forEach(s => s.onchange = async () => {
    try { await adm('orders/' + s.dataset.ost, 'PATCH', { status: s.value }); } catch (e) { alert(e.message); }
  });
}
async function tabProducts() {
  const P = await adm('products');
  const row = p => `<div class="arow" data-pid="${p.id}" data-img="${esc(p.image_url)}"><div class="aimg">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : BALL}</div>
  <div class="agrid"><input class="in" data-f="name" value="${esc(p.name)}" placeholder="Namn"><input class="in" data-f="price_sek" type="number" min="0" value="${p.price_sek}" placeholder="Pris (kr)"><input class="in" data-f="stock" type="number" min="0" value="${p.stock}" placeholder="Lager">
  <textarea class="in" data-f="description" placeholder="Beskrivning">${esc(p.description)}</textarea></div>
  <div class="acts"><label><input type="checkbox" data-f="active" ${p.active ? 'checked' : ''}> Synlig i butiken</label><input type="file" accept="image/png,image/jpeg,image/webp" data-file>
  <button class="btn sm" data-save>Spara</button><button class="btn sm danger" data-del>Ta bort</button></div></div>`;
  $('#pane').innerHTML = `<h3>Lägg till produkt</h3><div class="arow" id="newp" data-img=""><div class="aimg">${BALL}</div>
  <div class="agrid"><input class="in" data-f="name" placeholder="Namn"><input class="in" data-f="price_sek" type="number" min="0" placeholder="Pris (kr)"><input class="in" data-f="stock" type="number" min="0" placeholder="Lager">
  <textarea class="in" data-f="description" placeholder="Beskrivning"></textarea></div>
  <div class="acts"><input type="file" accept="image/png,image/jpeg,image/webp" data-file><button class="btn sm" data-add-new>Lägg till</button></div></div>
  <h3 style="margin:26px 0 12px">Dina produkter</h3>${P.map(row).join('') || '<p class="muted">Inga produkter ännu.</p>'}<p class="err" id="perr" role="alert"></p>`;
  const read = async r => {
    const g = k => r.querySelector(`[data-f="${k}"]`); let img = r.dataset.img;
    const file = r.querySelector('[data-file]').files[0]; if (file) img = await upload(file);
    return { name: g('name').value, description: g('description').value, price_sek: g('price_sek').value, stock: g('stock').value, image_url: img, active: g('active') ? g('active').checked : true };
  };
  const guard = fn => async () => { $('#perr').textContent = ''; try { await fn(); await tabProducts(); } catch (e) { $('#perr').textContent = e.message; } };
  $('[data-add-new]').onclick = guard(async () => { await adm('products', 'POST', await read($('#newp'))); });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = guard(async () => { const r = b.closest('.arow'); await adm('products/' + r.dataset.pid, 'PATCH', await read(r)); }));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = guard(async () => { if (confirm('Ta bort produkten?')) await adm('products/' + b.closest('.arow').dataset.pid, 'DELETE'); }));
}
const PRESETS = {
  Fairway: { primary: '#14532d', accent: '#22c55e', bg: '#f6faf4', ink: '#10231a', gold: '#d4a72c' },
  Augusta: { primary: '#0b3d2e', accent: '#e8b923', bg: '#fbf8ee', ink: '#1b2a22', gold: '#e8b923' },
  Links: { primary: '#1d3b4f', accent: '#3aa6a0', bg: '#f5f1e6', ink: '#16232c', gold: '#d9a441' },
  Nattgolf: { primary: '#07140e', accent: '#34d27b', bg: '#0d1a13', ink: '#e6f2ea', gold: '#e3b341' },
};
const CNAMES = { primary: 'Huvudfärg', accent: 'Accent', bg: 'Bakgrund', ink: 'Text', gold: 'Knappar (guld)' };
async function tabTheme() {
  const s = (await call('/api/shop')).site, c = { ...PRESETS.Fairway, ...(s.colors || {}) };
  const t = (k, l, max = 120) => `<label class="f">${l}<input class="in" data-k="${k}" maxlength="${max}" value="${esc(s[k] ?? '')}"></label>`;
  $('#pane').innerHTML = `<h3>Färgtema</h3><div class="pre">${Object.keys(PRESETS).map(n => `<button class="btn ghost sm" data-pre="${n}">${n}</button>`).join('')}</div>
  <div class="colors">${Object.entries(CNAMES).map(([k, l]) => `<label class="f">${l}<input type="color" data-c="${k}" value="${c[k]}"></label>`).join('')}</div>
  <h3 style="margin:18px 0 8px">Säsongstema</h3><select class="in" id="seas" style="max-width:300px">${Object.entries(SEASON_NAMES).map(([k, v]) => `<option value="${k}" ${k === (s.season || 'none') ? 'selected' : ''}>${v}</option>`).join('')}</select>
  <h3 style="margin:22px 0 8px">Texter</h3>${t('title', 'Butiksnamn', 40)}${t('tagline', 'Underrubrik')}${t('hero_title', 'Rubrik på startsidan', 80)}${t('hero_text', 'Text under rubriken', 300)}
  <label class="f">Frakt (kr)<input class="in" type="number" min="0" data-k="shipping_sek" value="${Number(s.shipping_sek ?? 59)}" style="max-width:160px"></label>
  <h3 style="margin:22px 0 8px">Bakgrundsbild</h3><p class="muted" style="margin:0 0 8px">Lämna tom för den ritade golfbanan. Ladda upp en egen bild om du vill byta.</p>
  <input type="file" accept="image/png,image/jpeg,image/webp" id="hf"> <button class="btn ghost sm" id="hclr">Ta bort egen bild</button>
  <div class="err" id="terr" role="alert"></div><button class="btn" id="tsave">Spara utseende</button><span id="tok" class="muted"></span>`;
  let hero = s.hero_image || '';
  const cur = () => { const col = {}; document.querySelectorAll('[data-c]').forEach(i => col[i.dataset.c] = i.value);
    const o = { colors: col, season: $('#seas').value, hero_image: hero }; document.querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value); return o; };
  const preview = () => { const o = cur(); applyTheme(o); };
  document.querySelectorAll('[data-c]').forEach(i => i.oninput = preview);
  $('#seas').onchange = preview;
  document.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { for (const [k, v] of Object.entries(PRESETS[b.dataset.pre])) $(`[data-c="${k}"]`).value = v; preview(); });
  $('#hclr').onclick = () => { hero = ''; $('#hf').value = ''; };
  $('#tsave').onclick = async () => {
    $('#terr').textContent = ''; $('#tok').textContent = '';
    try { const f = $('#hf').files[0]; if (f) hero = await upload(f);
      await adm('settings', 'PUT', { value: cur() }); SITE = { ...SITE, ...cur() }; $('#tok').textContent = ' Sparat!';
    } catch (e) { $('#terr').textContent = e.message; }
  };
}

/* ---------- Start ---------- */
(async () => {
  try {
    if (IS_ADMIN) {
      const d = await call('/api/shop'); SITE = d.site; applyTheme(SITE); document.title = (SITE.title || 'Swing2Go') + ' – admin';
      TOK ? adminShell() : adminLogin();
    } else await initShop();
  } catch (e) {
    $('#app').innerHTML = `<div class="admin"><h2>Något gick fel</h2><p class="muted">${esc(e.message)}</p></div>`;
  }
})();
</script>
